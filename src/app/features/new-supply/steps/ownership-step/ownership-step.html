<div class="grid grid-cols-2 gap-5 max-w-170 max-[560px]:grid-cols-1">

  <button class="bg-white border-[1.5px] border-black/10 rounded-lg pt-6 px-5 pb-5 cursor-pointer transition-all flex flex-col items-center text-center hover:border-[#227CFF] hover:shadow-[0_0_0_3px_rgba(34,124,255,0.10)] hover:-translate-y-0.5" (click)="select.emit('with-change')">
    <div class="w-full mb-4">
      <img src="/ownership-image.svg" alt="Cambio de titularidad" draggable="false" class="w-full h-auto block pointer-events-none select-none" />
    </div>
    <span class="text-base font-bold text-[#0F172A]">Cambio de titularidad</span>
  </button>

  <button class="bg-white border-[1.5px] border-black/10 rounded-lg pt-6 px-5 pb-5 cursor-pointer transition-all flex flex-col items-center text-center hover:border-[#227CFF] hover:shadow-[0_0_0_3px_rgba(34,124,255,0.10)] hover:-translate-y-0.5" (click)="select.emit('without-change')">
    <div class="w-full mb-4">
      <img src="/ownership-image.svg" alt="Sin cambio de titular" draggable="false" class="w-full h-auto block pointer-events-none select-none" />
    </div>
    <span class="text-base font-bold text-[#0F172A]">Sin cambio de titular</span>
  </button>

</div>
