<p-dialog
  [visible]="true"
  [header]="(editBoe ? 'Editar' : 'Nueva') + ' Potencia BOE · ' + tariffCode"
  [modal]="true"
  [style]="{ width: '580px' }"
  [draggable]="false"
  [closable]="true"
  (onHide)="cancelled.emit()">
  <div class="flex flex-col gap-[1.1rem]">
    <p class="text-[0.8rem] text-sx-text-3 m-0 mb-2">Precios regulados — sobrescribe todos los períodos anteriores</p>

    @if (apiError) { <div class="flex items-center gap-2 py-2.5 px-3 rounded-lg bg-sx-red-bg border border-sx-red text-sx-red text-[0.8rem]"><i class="pi pi-exclamation-circle"></i>{{ apiError }}</div> }

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label class="text-[0.78rem] font-semibold text-sx-text-2 uppercase tracking-wide">Válido desde *</label>
        <input pInputText type="date" [(ngModel)]="validFrom" class="w-full" [class.field-error]="sub && !validFrom" />
        @if (sub && !validFrom) { <span class="text-[0.76rem] text-sx-red">Obligatorio</span> }
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[0.78rem] font-semibold text-sx-text-2 uppercase tracking-wide">Válido hasta <span class="font-normal normal-case tracking-normal">(opcional)</span></label>
        <input pInputText type="date" [(ngModel)]="validUntil" class="w-full" />
      </div>
    </div>

    <div class="border border-sx-border rounded-xl p-[0.9rem]">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div>
          <span class="text-[0.85rem] font-semibold text-sx-text block">Valores BOE</span>
          <span class="text-[0.72rem] text-sx-text-3">€/kW·año — el backend divide entre 365</span>
        </div>
        <div class="flex gap-1.5 items-center">
          <input pInputText type="number" [(ngModel)]="commonVal" placeholder="Valor común" step="0.000001" class="w-27.5" />
          <p-button label="Aplicar a todos" [text]="true" size="small" (onClick)="applyAll()" />
        </div>
      </div>
      <div class="grid gap-2.5" [style.grid-template-columns]="'repeat(' + columnCount + ', minmax(0,1fr))'">
        @for (p of visiblePeriods; track p; let i = $index) {
          <div class="flex flex-col gap-0.75 min-w-0">
            <label class="text-[0.7rem] font-bold text-sx-text-3 text-center">{{ p }}</label>
            <input pInputText type="number" [(ngModel)]="values[i]" step="0.000001" placeholder="0.000000" class="text-center w-full min-w-0" />
          </div>
        }
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="cancelled.emit()" [disabled]="saving()" />
    <p-button [label]="editBoe ? 'Guardar cambios' : 'Guardar BOE'" icon="pi pi-check"
              (onClick)="submit()" [loading]="saving()">
      <ng-template pTemplate="loadingicon">
        <app-suminex-loader [size]="14" [onColor]="true" />
      </ng-template>
    </p-button>
  </ng-template>
</p-dialog>
